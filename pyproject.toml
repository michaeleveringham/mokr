[project]
name = "mokr"
version = "1.0.0"
description = "Remote web browser automation."
authors = [{name = "Michael Everingham", email = "36551116+michaeleveringham@users.noreply.github.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyee>=13.0.1",
    "websockets>=16.1.1",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "httpx[http2,socks]>=0.28.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
mokr = "mokr.console:main"

[dependency-groups]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autoapi>=3.0.0",
    "myst-parser>=2.0.0",
    "sphinxnotes-comboroles>=1.0.0b0",
]
test = [
    "black>=23.0.0",
    "pytest>=8.0.2",
]

[tool.black]
line-length = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = [
    "integration: requires a locally installed browser and is disabled by default",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
